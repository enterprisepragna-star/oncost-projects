<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · ONCOST</title>
  <link rel="stylesheet" href="storefront.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--cream),var(--gold-soft));padding:20px;">
  <div style="max-width:420px;width:100%;background:#FFF;padding:36px;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line);">
    <a href="index.html" style="display:block;text-align:center;font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--burgundy);letter-spacing:3px;margin-bottom:6px;">ONCOST</a>
    <div style="text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:24px;">Welcome back</div>
    <h2 style="text-align:center;font-size:1.6rem;margin-bottom:24px;">Sign In</h2>
    <div id="err" style="background:#fbecec;color:var(--error);border:1px solid #e8c1c1;padding:10px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none;"></div>
    <button type="button" id="google-btn" data-testid="google-signin-btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;transition:border-color .15s, box-shadow .15s;" onmouseover="this.style.borderColor='var(--burgundy)';this.style.boxShadow='0 2px 10px rgba(0,0,0,.08)'" onmouseout="this.style.borderColor='var(--line)';this.style.boxShadow='none'">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C40.9 35.6 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>
    <div style="display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:10px;letter-spacing:1.5px;"><span style="flex:1;height:1px;background:var(--line);"></span>OR SIGN IN WITH EMAIL<span style="flex:1;height:1px;background:var(--line);"></span></div>
    <form id="login-form" style="display:flex;flex-direction:column;gap:14px;">
      <label style="font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;">Email
        <input class="field" type="email" id="email" required placeholder="you@example.com" style="margin-top:6px;width:100%;" />
      </label>
      <label style="font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase;">Password
        <input class="field" type="password" id="password" required placeholder="••••••••" style="margin-top:6px;width:100%;" />
      </label>
      <button class="btn primary" type="submit" id="btn"><i class="fas fa-right-to-bracket"></i> Sign In</button>
    </form>
    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--muted);">
      New here? <a href="signup.html" style="color:var(--burgundy);font-weight:600;">Create an account</a>
    </div>
    <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="index.html" style="color:var(--muted);">← Back to store</a></div>
  </div>

  <script>
    const f = document.getElementById('login-form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = redirect;
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      const gb = document.getElementById('google-btn');
      gb.disabled = true; gb.style.opacity = '0.6';
      const fail = (msg) => { err.textContent = msg; err.style.display = 'block'; gb.disabled = false; gb.style.opacity = '1'; };
      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: new URL(redirect, location.origin).href, skipBrowserRedirect: true },
      });
      if (error || !data?.url) return fail(error?.message || 'Could not start Google sign-in.');
      try {
        const chk = await fetch(data.url, { redirect: 'manual' });
        if (chk.status === 400) return fail('Google sign-in is not enabled yet. Please use email login below.');
      } catch (_) { /* opaque redirect = provider enabled */ }
      location.href = data.url;
    });

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      btn.disabled = true; btn.innerHTML = 'Signing in…';
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value.trim().toLowerCase(),
        password: document.getElementById('password').value,
      });
      if (error) { err.textContent = error.message; err.style.display = 'block'; btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In'; return; }
      location.href = redirect;
    });
  </script>
</body>
</html>
